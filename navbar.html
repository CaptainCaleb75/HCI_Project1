    <script>
        const form = document.getElementById('rule_form');

        form.addEventListener('submit', function(e){
            e.preventDefault();

            const f_data = new FormData(e.target);
            const value = Object.fromEntries(f_data).rule_num;
            console.log(value);
            switch(value){
                case '1':
                    window.location.href = "/HCI_Project1/GR-1/Consistency.html";
                    break;
                case '2':
                    window.location.href = "/HCI_Project1/GR-2/Universal.html";
                    break;
                case '3':
                    window.location.href = "/HCI_Project1/GR-3/informative_feedback.html";
                    break;
                case '4':
                    window.location.href = "/HCI_Project1/GR-4/mystery.html";
                    break;
                case '5':
                    window.location.href = "/HCI_Project1/GR-5/signup.html";
                    break;
                case '6':
                    window.location.href = "/HCI_Project1/GR-6/action_reversal.html";
                    break;
                case '7':
                    window.location.href = "/HCI_Project1/GR-7/internal_locus_of_control.html";
                    break;
                case '8':
                    window.location.href = "/HCI_Project1/GR-8/reduce_short_term_mem_load.html";
                    break;
                default:
                    console.error("Navbar form error, invalid selection: " + value);
            }
        })
